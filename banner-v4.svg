<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Alejandro Mercado">
  <defs>
    <!-- Apple Top Loading Progress Bar Gradient -->
    <linearGradient id="apple-loader-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="60%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>

    <!-- Metallic Text Shimmer on Headline -->
    <linearGradient id="apple-shimmer" x1="-100%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#737373"/>
      <stop offset="30%" stop-color="#8e8e93"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#8e8e93"/>
      <stop offset="100%" stop-color="#737373"/>
      <animate attributeName="x1" from="-100%" to="100%" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="0%" to="200%" dur="4s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Ambient Aurora Glow (Apple Intelligence Style) -->
    <radialGradient id="aurora" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.14">
        <animate attributeName="stop-color" values="#2563eb;#7c3aed;#06b6d4;#2563eb" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.05">
        <animate attributeName="stop-color" values="#7c3aed;#06b6d4;#2563eb;#7c3aed" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0a0a0c" stop-opacity="0"/>
    </radialGradient>

    <!-- Background Canvas Gradient -->
    <linearGradient id="apple-canvas" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141417"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>

    <!-- Hairline Border -->
    <linearGradient id="apple-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>

    <style>
      .eyebrow {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 4px;
        fill: #86868b;
        text-transform: uppercase;
      }
      .headline {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif;
        font-size: 46px;
        font-weight: 700;
        letter-spacing: -1.2px;
        fill: url(#apple-shimmer);
      }
      .subheadline {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', sans-serif;
        font-size: 16px;
        font-weight: 400;
        fill: #a1a1a6;
        letter-spacing: -0.2px;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', sans-serif;
        font-size: 11px;
        font-weight: 500;
        fill: #d1d1d6;
        letter-spacing: 0.3px;
      }
      .fade-entrance {
        animation: softEntrance 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      @keyframes softEntrance {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </defs>

  <!-- Clean Obsidian Background -->
  <rect width="1200" height="260" rx="16" fill="url(#apple-canvas)"/>

  <!-- Ambient Aurora Glow -->
  <rect width="1200" height="260" rx="16" fill="url(#aurora)"/>

  <!-- Subtle Hairline Border -->
  <rect x="0.5" y="0.5" width="1199" height="259" rx="15.5" fill="none" stroke="url(#apple-border)" stroke-width="1"/>

  <!-- Apple Loading Progress Bar (Sweeps 0% to 100% on page load, then dissolves) -->
  <rect x="0" y="0" width="0" height="2" fill="url(#apple-loader-line)">
    <animate attributeName="width" from="0" to="1200" dur="1.5s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0;1"/>
    <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.8;1" dur="2.1s" fill="freeze"/>
  </rect>

  <!-- Content Group (Exact Previous Design) -->
  <g transform="translate(80, 56)" class="fade-entrance">
    <!-- Eyebrow -->
    <text x="0" y="0" class="eyebrow">ALEJANDRO MERCADO · FULL STACK DEVELOPER</text>

    <!-- Main Headline with Animated Metallic Shimmer -->
    <text x="0" y="50" class="headline">Engineering with precision and flow.</text>

    <!-- Subheadline -->
    <text x="0" y="88" class="subheadline">Building scalable digital experiences through modern architecture and vibe coding.</text>

    <!-- Minimalist Apple Pills with Subtle Pulsing Radar Dot -->
    <g transform="translate(0, 122)">
      <!-- Pill 1 -->
      <rect width="170" height="30" rx="15" fill="#1c1c1e" stroke="#2c2c2e" stroke-width="1"/>
      <text x="85" y="19" class="pill-text" text-anchor="middle">Full Stack Architecture</text>

      <!-- Pill 2 -->
      <rect x="182" width="120" height="30" rx="15" fill="#1c1c1e" stroke="#2c2c2e" stroke-width="1"/>
      <text x="242" y="19" class="pill-text" text-anchor="middle">Vibe Coding</text>

      <!-- Pill 3 with Subtle Pulsing Green Radar Dot -->
      <g transform="translate(314, 0)">
        <rect width="186" height="30" rx="15" fill="#1c1c1e" stroke="#2c2c2e" stroke-width="1"/>
        
        <!-- Radar Pulse Circle -->
        <circle cx="20" cy="15" r="4" fill="#30d158" opacity="0.4">
          <animate attributeName="r" values="4;9;4" dur="2.4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.6;0;0.6" dur="2.4s" repeatCount="indefinite"/>
        </circle>
        
        <!-- Solid Center Dot -->
        <circle cx="20" cy="15" r="3.5" fill="#30d158"/>
        
        <text x="106" y="19" class="pill-text" text-anchor="middle">Available for Projects</text>
      </g>
    </g>
  </g>
</svg>
