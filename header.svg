<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Alejandro Mercado - Merc4x Header">
  <defs>
    <!-- Gradients -->
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="50%" stop-color="#00bbf9"/>
      <stop offset="100%" stop-color="#9b5de5"/>
    </linearGradient>

    <linearGradient id="box-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121829" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="wave-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="50%" stop-color="#00bbf9"/>
      <stop offset="100%" stop-color="#f15bb5"/>
    </linearGradient>

    <radialGradient id="corner-glow" cx="1" cy="0" r="0.7">
      <stop offset="0%" stop-color="#9b5de5" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#9b5de5" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="left-glow" cx="0.1" cy="0.8" r="0.6">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0"/>
    </radialGradient>

    <!-- Circuit / Tech Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1b2438" stroke-width="0.7" stroke-opacity="0.6"/>
      <circle cx="0" cy="0" r="1.5" fill="#00bbf9" fill-opacity="0.3"/>
    </pattern>

    <style>
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 900; }
      .code { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
      
      /* Audio / Vibe wave animations */
      @keyframes eq1 { 0%, 100% { height: 18px; y: 62px; } 50% { height: 48px; y: 32px; } }
      @keyframes eq2 { 0%, 100% { height: 45px; y: 35px; } 50% { height: 20px; y: 60px; } }
      @keyframes eq3 { 0%, 100% { height: 60px; y: 20px; } 50% { height: 35px; y: 45px; } }
      @keyframes eq4 { 0%, 100% { height: 30px; y: 50px; } 50% { height: 70px; y: 10px; } }
      @keyframes eq5 { 0%, 100% { height: 50px; y: 30px; } 50% { height: 22px; y: 58px; } }
      
      .bar1 { animation: eq1 1.2s ease-in-out infinite; }
      .bar2 { animation: eq2 0.9s ease-in-out infinite; }
      .bar3 { animation: eq3 1.4s ease-in-out infinite; }
      .bar4 { animation: eq4 1.1s ease-in-out infinite; }
      .bar5 { animation: eq5 1.3s ease-in-out infinite; }

      .blink { animation: blink 1.2s infinite; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="18" fill="#070a13"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="18" fill="url(#left-glow)"/>
  <rect width="1200" height="320" rx="18" fill="url(#corner-glow)"/>

  <!-- Geometric Accent Lines -->
  <line x1="48" y1="42" x2="1152" y2="42" stroke="#1f2c47" stroke-width="1"/>
  <line x1="48" y1="282" x2="1152" y2="282" stroke="#1f2c47" stroke-width="1"/>
  
  <!-- Outer Card Border -->
  <rect x="0.5" y="0.5" width="1199" height="319" rx="17.5" fill="none" stroke="#253556" stroke-width="1.2"/>

  <!-- TOP HEADER BAR -->
  <text x="56" y="28" class="code" font-size="11" font-weight="700" fill="#00f5d4" letter-spacing="2">SYS_ID // MERC4X.DEV</text>
  <text x="600" y="28" class="code" font-size="11" fill="#4d6189" text-anchor="middle" letter-spacing="1">ARCH: FULL STACK // WORKFLOW: VIBE CODING</text>
  
  <g transform="translate(1085, 17)">
    <circle cx="6" cy="7" r="4" fill="#00f5d4" class="blink"/>
    <text x="18" y="11" class="code" font-size="11" font-weight="700" fill="#a4b4d6">ACTIVE</text>
  </g>

  <!-- LEFT SECTION: Identity -->
  <!-- Tag -->
  <g transform="translate(56, 75)">
    <rect width="168" height="24" rx="4" fill="#121b2f" stroke="#00bbf9" stroke-opacity="0.4" stroke-width="1"/>
    <text x="10" y="16" class="code" font-size="10" font-weight="700" fill="#00bbf9" letter-spacing="1.5">FULL STACK ENGINEER</text>
  </g>

  <!-- Main Name -->
  <text x="56" y="148" class="title" font-size="52" letter-spacing="-1" fill="url(#neon-grad)">ALEJANDRO MERCADO</text>

  <!-- Subtitle / Statement -->
  <text x="56" y="185" class="code" font-size="15" fill="#8e9ebc">Turning vision into reality with scalable code and seamless flow.</text>

  <!-- Core Stack Chips -->
  <g transform="translate(56, 218)">
    <!-- Chip 1 -->
    <rect x="0" y="0" width="70" height="28" rx="6" fill="#101726" stroke="#1d283e" stroke-width="1"/>
    <text x="35" y="18" class="code" font-size="11" font-weight="700" fill="#00f5d4" text-anchor="middle">React</text>

    <!-- Chip 2 -->
    <rect x="80" y="0" width="78" height="28" rx="6" fill="#101726" stroke="#1d283e" stroke-width="1"/>
    <text x="119" y="18" class="code" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Next.js</text>

    <!-- Chip 3 -->
    <rect x="168" y="0" width="94" height="28" rx="6" fill="#101726" stroke="#1d283e" stroke-width="1"/>
    <text x="215" y="18" class="code" font-size="11" font-weight="700" fill="#00bbf9" text-anchor="middle">TypeScript</text>

    <!-- Chip 4 -->
    <rect x="272" y="0" width="78" height="28" rx="6" fill="#101726" stroke="#1d283e" stroke-width="1"/>
    <text x="311" y="18" class="code" font-size="11" font-weight="700" fill="#f15bb5" text-anchor="middle">Python</text>

    <!-- Chip 5 -->
    <rect x="360" y="0" width="82" height="28" rx="6" fill="#101726" stroke="#1d283e" stroke-width="1"/>
    <text x="401" y="18" class="code" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">Node.js</text>

    <!-- Chip 6: Vibe Coding -->
    <rect x="452" y="0" width="112" height="28" rx="6" fill="#101726" stroke="#9b5de5" stroke-opacity="0.6" stroke-width="1"/>
    <text x="508" y="18" class="code" font-size="11" font-weight="700" fill="#9b5de5" text-anchor="middle">Vibe Coding</text>
  </g>

  <!-- RIGHT SECTION: Telemetry Card + Vibe Audio Visualizer -->
  <g transform="translate(770, 68)">
    <!-- Box Frame -->
    <rect width="375" height="188" rx="10" fill="url(#box-grad)" stroke="#22304d" stroke-width="1"/>
    
    <!-- Box Top Bar -->
    <rect width="375" height="30" rx="10" fill="#121826"/>
    <rect y="18" width="375" height="12" fill="#121826"/>
    <line x1="0" y1="30" x2="375" y2="30" stroke="#22304d" stroke-width="1"/>
    
    <text x="16" y="20" class="code" font-size="11" font-weight="700" fill="#6579a3" letter-spacing="1">VIBE_CORE // TELEMETRY</text>
    <circle cx="355" cy="15" r="4" fill="#00f5d4"/>

    <!-- Telemetry Data -->
    <g transform="translate(18, 48)">
      <text x="0" y="14" class="code" font-size="12" fill="#586c91">CORE_FOCUS</text>
      <text x="135" y="14" class="code" font-size="12" font-weight="600" fill="#c4d1eb">Full Stack Web Apps</text>

      <text x="0" y="38" class="code" font-size="12" fill="#586c91">METHODOLOGY</text>
      <text x="135" y="38" class="code" font-size="12" font-weight="600" fill="#00f5d4">AI-Driven Vibe Flow</text>

      <text x="0" y="62" class="code" font-size="12" fill="#586c91">AVAILABILITY</text>
      <text x="135" y="62" class="code" font-size="12" font-weight="600" fill="#00bbf9">Open for Projects</text>
    </g>

    <!-- Dynamic Audio / Rhythm Spectrum Visualizer (Flow state representation) -->
    <g transform="translate(18, 122)">
      <text x="0" y="18" class="code" font-size="10" fill="#475775" letter-spacing="1">FLOW STATE FREQUENCY</text>
      
      <!-- Visualizer bars -->
      <g transform="translate(170, -18)">
        <rect x="0" y="20" width="5" height="35" rx="2" fill="url(#wave-grad)" class="bar1"/>
        <rect x="9" y="30" width="5" height="25" rx="2" fill="url(#wave-grad)" class="bar2"/>
        <rect x="18" y="15" width="5" height="40" rx="2" fill="url(#wave-grad)" class="bar3"/>
        <rect x="27" y="25" width="5" height="30" rx="2" fill="url(#wave-grad)" class="bar4"/>
        <rect x="36" y="10" width="5" height="45" rx="2" fill="url(#wave-grad)" class="bar5"/>
        <rect x="45" y="22" width="5" height="33" rx="2" fill="url(#wave-grad)" class="bar2"/>
        <rect x="54" y="16" width="5" height="39" rx="2" fill="url(#wave-grad)" class="bar1"/>
        <rect x="63" y="28" width="5" height="27" rx="2" fill="url(#wave-grad)" class="bar4"/>
        <rect x="72" y="12" width="5" height="43" rx="2" fill="url(#wave-grad)" class="bar3"/>
        <rect x="81" y="26" width="5" height="29" rx="2" fill="url(#wave-grad)" class="bar5"/>
        <rect x="90" y="18" width="5" height="37" rx="2" fill="url(#wave-grad)" class="bar2"/>
        <rect x="99" y="24" width="5" height="31" rx="2" fill="url(#wave-grad)" class="bar1"/>
        <rect x="108" y="32" width="5" height="23" rx="2" fill="url(#wave-grad)" class="bar4"/>
        <rect x="117" y="15" width="5" height="40" rx="2" fill="url(#wave-grad)" class="bar3"/>
        <rect x="126" y="25" width="5" height="30" rx="2" fill="url(#wave-grad)" class="bar5"/>
        <rect x="135" y="35" width="5" height="20" rx="2" fill="url(#wave-grad)" class="bar1"/>
      </g>
    </g>
  </g>

  <!-- BOTTOM FOOTER ACCENTS -->
  <text x="56" y="303" class="code" font-size="10" fill="#3b4b6b">PORTFOLIO // 2026</text>
  <text x="1144" y="303" class="code" font-size="10" fill="#3b4b6b" text-anchor="end">MERC4X · GITHUB PROFILE</text>
</svg>
