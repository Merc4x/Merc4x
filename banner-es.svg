<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Alejandro Mercado">
  <defs>
    <!-- Progress Bar Gradient -->
    <linearGradient id="apple-loader-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Metallic Text Shimmer -->
    <linearGradient id="apple-shimmer-es" x1="-100%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#737373"/>
      <stop offset="30%" stop-color="#8e8e93"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#8e8e93"/>
      <stop offset="100%" stop-color="#737373"/>
      <animate attributeName="x1" from="-100%" to="100%" dur="4.2s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="0%" to="200%" dur="4.2s" begin="1.2s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Ambient Aurora Glow -->
    <radialGradient id="aurora-es" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.14">
        <animate attributeName="stop-color" values="#2563eb;#7c3aed;#06b6d4;#2563eb" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.05">
        <animate attributeName="stop-color" values="#7c3aed;#06b6d4;#2563eb;#7c3aed" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0a0a0c" stop-opacity="0"/>
    </radialGradient>

    <!-- Background Canvas Gradient -->
    <linearGradient id="canvas-es" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141417"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>

    <!-- Hairline Border -->
    <linearGradient id="border-es" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>

    <style>
      .eyebrow {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 4px;
        fill: #86868b;
        text-transform: uppercase;
      }
      .headline {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif;
        font-size: 45px;
        font-weight: 700;
        letter-spacing: -1.2px;
        fill: url(#apple-shimmer-es);
      }
      .subheadline {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', sans-serif;
        font-size: 16px;
        font-weight: 400;
        fill: #a1a1a6;
        letter-spacing: -0.2px;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', sans-serif;
        font-size: 11px;
        font-weight: 500;
        fill: #d1d1d6;
        letter-spacing: 0.3px;
      }
      .loading-text {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', sans-serif;
        font-size: 11px;
        font-weight: 500;
        fill: #00f5d4;
        letter-spacing: 0.5px;
      }
      .content-fade {
        animation: smoothEntrance 1.1s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      @keyframes smoothEntrance {
        0% { opacity: 0; transform: translateY(6px); }
        100% { opacity: 1; transform: translateY(0); }
      }
    </style>
  </defs>

  <!-- Clean Obsidian Background -->
  <rect width="1200" height="260" rx="16" fill="url(#canvas-es)"/>

  <!-- Ambient Aurora Glow -->
  <rect width="1200" height="260" rx="16" fill="url(#aurora-es)"/>

  <!-- Hairline Border -->
  <rect x="0.5" y="0.5" width="1199" height="259" rx="15.5" fill="none" stroke="url(#border-es)" stroke-width="1"/>

  <!-- Apple Progress Line (Smooth 0% to 100% loading effect at top edge) -->
  <rect x="0" y="0" width="0" height="2" fill="url(#apple-loader-grad)">
    <animate attributeName="width" from="0" to="1200" dur="1.8s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0;1"/>
    <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.85;1" dur="2.4s" fill="freeze"/>
  </rect>

  <!-- Main Content (Smooth Reveal) -->
  <g transform="translate(80, 56)" class="content-fade">
    <!-- Eyebrow en español -->
    <text x="0" y="0" class="eyebrow">ALEJANDRO MERCADO · DESARROLLADOR FULL STACK</text>

    <!-- Titular en español con reflejo metálico continuo -->
    <text x="0" y="50" class="headline">Ingeniería con precisión y fluidez.</text>

    <!-- Subtítulo en español -->
    <text x="0" y="88" class="subheadline">Construyendo productos digitales escalables mediante arquitectura moderna y vibe coding.</text>

    <!-- Píldoras con efecto de carga y transición de estado -->
    <g transform="translate(0, 122)">
      <!-- Píldora 1 -->
      <rect width="180" height="30" rx="15" fill="#1c1c1e" stroke="#2c2c2e" stroke-width="1"/>
      <text x="90" y="19" class="pill-text" text-anchor="middle">Arquitectura Full Stack</text>

      <!-- Píldora 2 -->
      <rect x="192" width="120" height="30" rx="15" fill="#1c1c1e" stroke="#2c2c2e" stroke-width="1"/>
      <text x="252" y="19" class="pill-text" text-anchor="middle">Vibe Coding</text>

      <!-- Píldora 3: Estado con transición de "Cargando..." a "Disponible para proyectos" -->
      <g transform="translate(324, 0)">
        <rect width="195" height="30" rx="15" fill="#1c1c1e" stroke="#2c2c2e" stroke-width="1"/>

        <!-- ESTADO 1: Cargando (de t=0s a t=1.8s) -->
        <g>
          <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.85;1" dur="1.8s" fill="freeze"/>
          
          <!-- Micro spinner / indicador de carga -->
          <circle cx="20" cy="15" r="4" fill="none" stroke="#00f5d4" stroke-width="1.5" stroke-dasharray="8 6">
            <animateTransform attributeName="transform" type="rotate" from="0 20 15" to="360 20 15" dur="1s" repeatCount="indefinite"/>
          </circle>
          
          <text x="110" y="19" class="loading-text" text-anchor="middle">Cargando perfil...</text>
        </g>

        <!-- ESTADO 2: Listo y disponible (a partir de t=1.8s) -->
        <g opacity="0">
          <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.9;1" dur="2s" fill="freeze"/>
          
          <!-- Radar Pulse -->
          <circle cx="20" cy="15" r="4" fill="#30d158" opacity="0.4">
            <animate attributeName="r" values="4;9;4" dur="2.4s" begin="2s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0.6;0;0.6" dur="2.4s" begin="2s" repeatCount="indefinite"/>
          </circle>
          
          <!-- Solid Dot -->
          <circle cx="20" cy="15" r="3.5" fill="#30d158"/>
          
          <text x="110" y="19" class="pill-text" text-anchor="middle">Disponible para proyectos</text>
        </g>
      </g>
    </g>
  </g>
</svg>
