<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" role="img" aria-label="Salud Laboral Preview">
  <defs>
    <linearGradient id="sl-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1626"/>
      <stop offset="100%" stop-color="#060c14"/>
    </linearGradient>

    <linearGradient id="sl-hero" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="60%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="sl-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141f33"/>
      <stop offset="100%" stop-color="#0f1726"/>
    </linearGradient>

    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: 'JetBrains Mono', Consolas, monospace; }
    </style>
  </defs>

  <!-- Frame Background -->
  <rect width="600" height="340" rx="12" fill="url(#sl-bg)"/>
  <rect x="0.5" y="0.5" width="599" height="339" rx="11.5" fill="none" stroke="#1f2c42" stroke-width="1"/>

  <!-- Browser Window Header -->
  <rect width="600" height="34" rx="12" fill="#090e17"/>
  <rect y="20" width="600" height="14" fill="#090e17"/>
  <line x1="0" y1="34" x2="600" y2="34" stroke="#1b2538" stroke-width="1"/>
  
  <circle cx="20" cy="17" r="4.5" fill="#ff5f56"/>
  <circle cx="36" cy="17" r="4.5" fill="#ffbd2e"/>
  <circle cx="52" cy="17" r="4.5" fill="#27c93f"/>
  
  <!-- Address Bar -->
  <rect x="140" y="7" width="320" height="20" rx="4" fill="#131b2b" stroke="#1f2c42" stroke-width="1"/>
  <text x="300" y="21" class="mono" font-size="10" fill="#64748b" text-anchor="middle">https://saludlaboral.app/servicios-sst</text>

  <!-- Browser Content -->
  <g transform="translate(24, 48)">
    <!-- Hero Banner -->
    <rect width="552" height="110" rx="8" fill="url(#sl-hero)" stroke="#059669" stroke-opacity="0.4" stroke-width="1"/>
    
    <text x="24" y="36" class="sans" font-size="18" font-weight="800" fill="#ffffff">Soluciones Administrativas en Salud Laboral</text>
    <text x="24" y="58" class="sans" font-size="12" fill="#a7f3d0">Gestión integral, asesoría y cumplimiento normativo en SG-SST.</text>
    
    <!-- CTA Button in Mockup -->
    <rect x="24" y="72" width="168" height="24" rx="12" fill="#10b981"/>
    <text x="108" y="88" class="sans" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Agendar Cita WhatsApp</text>

    <!-- 3 Service Cards Mockup -->
    <g transform="translate(0, 122)">
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="176" height="116" rx="8" fill="url(#sl-card)" stroke="#22324f" stroke-width="1"/>
        <rect x="14" y="14" width="28" height="28" rx="6" fill="#064e3b"/>
        <text x="28" y="32" class="mono" font-size="12" fill="#34d399" text-anchor="middle">§</text>
        <text x="14" y="62" class="sans" font-size="12" font-weight="700" fill="#ffffff">Asesoría SG-SST</text>
        <text x="14" y="80" class="sans" font-size="10" fill="#94a3b8">Diseño e implementación bajo normativa legal.</text>
        <text x="14" y="102" class="sans" font-size="9" font-weight="600" fill="#10b981">Ver Servicios →</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(188, 0)">
        <rect width="176" height="116" rx="8" fill="url(#sl-card)" stroke="#22324f" stroke-width="1"/>
        <rect x="14" y="14" width="28" height="28" rx="6" fill="#1e3a8a"/>
        <text x="28" y="32" class="mono" font-size="12" fill="#60a5fa" text-anchor="middle">✓</text>
        <text x="14" y="62" class="sans" font-size="12" font-weight="700" fill="#ffffff">Capacitaciones</text>
        <text x="14" y="80" class="sans" font-size="10" fill="#94a3b8">Auditorías preventivas y formación de brigadas.</text>
        <text x="14" y="102" class="sans" font-size="9" font-weight="600" fill="#38bdf8">Explorar Cursos →</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(376, 0)">
        <rect width="176" height="116" rx="8" fill="url(#sl-card)" stroke="#22324f" stroke-width="1"/>
        <rect x="14" y="14" width="28" height="28" rx="6" fill="#4c1d95"/>
        <text x="28" y="32" class="mono" font-size="12" fill="#c084fc" text-anchor="middle">❖</text>
        <text x="14" y="62" class="sans" font-size="12" font-weight="700" fill="#ffffff">Trámites Seguros</text>
        <text x="14" y="80" class="sans" font-size="10" fill="#94a3b8">Gestión de riesgos ARL, EPS y pólizas laborales.</text>
        <text x="14" y="102" class="sans" font-size="9" font-weight="600" fill="#a855f7">Consultar →</text>
      </g>
    </g>

    <!-- Meta Footer -->
    <text x="0" y="256" class="mono" font-size="10" fill="#475569">FLASK · PYTHON 3.10 · JINJA2 TEMPLATES · CSS3</text>
    <text x="552" y="256" class="mono" font-size="10" fill="#34d399" text-anchor="end">PLATAFORMA WEB</text>
  </g>
</svg>
