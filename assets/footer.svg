<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="90" viewBox="0 0 1200 90" role="img" aria-label="Merc4x Footer">
  <defs>
    <!-- Wave 1 Gradient (Deep Cobalt to Violet) -->
    <linearGradient id="wave-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.3"/>
      <stop offset="35%" stop-color="#2563eb" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#7c3aed" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0e1726" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Wave 2 Gradient (Violet to Electric Blue) -->
    <linearGradient id="wave-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="45%" stop-color="#4f46e5" stop-opacity="0.4"/>
      <stop offset="85%" stop-color="#9333ea" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Glowing Hairline Rim Gradient -->
    <linearGradient id="rim-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0"/>
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="55%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#c084fc" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtle Center Glow -->
    <radialGradient id="center-glow" cx="50%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <style>
      .signature {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', sans-serif;
        font-size: 11px;
        font-weight: 500;
        fill: #86868b;
        letter-spacing: 3px;
        text-transform: uppercase;
      }
    </style>
  </defs>

  <!-- Ambient Base Glow -->
  <rect width="1200" height="90" fill="url(#center-glow)"/>

  <!-- Smooth Background Wave Layer -->
  <path d="M 0 45 Q 320 18 640 40 T 1200 32 L 1200 90 L 0 90 Z" fill="url(#wave-grad-1)"/>

  <!-- Smooth Foreground Wave Layer -->
  <path d="M 0 35 Q 280 52 600 28 T 1200 42 L 1200 90 L 0 90 Z" fill="url(#wave-grad-2)"/>

  <!-- Glowing Hairline Rim on the Top Edge -->
  <path d="M 0 35 Q 280 52 600 28 T 1200 42" fill="none" stroke="url(#rim-grad)" stroke-width="1.2"/>

  <!-- Centered Subtle Micro-Brand Signature -->
  <text x="600" y="74" class="signature" text-anchor="middle">MERC4X · INGENIERÍA &amp; VIBE CODING</text>
</svg>
