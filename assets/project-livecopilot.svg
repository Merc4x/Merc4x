<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" role="img" aria-label="LiveCopilot Preview">
  <defs>
    <linearGradient id="lc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#141a29"/>
    </linearGradient>

    <linearGradient id="lc-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#00bbf9"/>
    </linearGradient>

    <linearGradient id="hud-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2236" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f1523" stop-opacity="0.95"/>
    </linearGradient>

    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: 'JetBrains Mono', Consolas, monospace; }
    </style>
  </defs>

  <!-- Frame Background -->
  <rect width="600" height="340" rx="12" fill="url(#lc-bg)"/>
  <rect x="0.5" y="0.5" width="599" height="339" rx="11.5" fill="none" stroke="#25324d" stroke-width="1"/>

  <!-- Window Header -->
  <rect width="600" height="34" rx="12" fill="#090d16"/>
  <rect y="20" width="600" height="14" fill="#090d16"/>
  <line x1="0" y1="34" x2="600" y2="34" stroke="#1c263b" stroke-width="1"/>
  
  <circle cx="20" cy="17" r="4.5" fill="#ff5f56"/>
  <circle cx="36" cy="17" r="4.5" fill="#ffbd2e"/>
  <circle cx="52" cy="17" r="4.5" fill="#27c93f"/>
  <text x="300" y="21" class="mono" font-size="11" fill="#7182a4" text-anchor="middle">LiveCopilot — Desktop Audio AI (HUD)</text>

  <!-- Floating HUD Window Mockup -->
  <g transform="translate(36, 52)">
    <rect width="528" height="260" rx="10" fill="url(#hud-glass)" stroke="#2f4063" stroke-width="1"/>
    
    <!-- Top HUD Bar -->
    <rect width="528" height="36" rx="10" fill="#141c2c"/>
    <rect y="24" width="528" height="12" fill="#141c2c"/>
    <line x1="0" y1="36" x2="528" y2="36" stroke="#26344f" stroke-width="0.8"/>
    
    <!-- Status LED -->
    <circle cx="22" cy="18" r="4" fill="#00f5d4"/>
    <text x="34" y="22" class="mono" font-size="11" font-weight="700" fill="#00f5d4">LISTENING · WASAPI 16kHz</text>
    
    <!-- Audio VU Meter Simulation -->
    <g transform="translate(380, 12)">
      <rect x="0" y="3" width="4" height="12" rx="1" fill="#00f5d4"/>
      <rect x="7" y="1" width="4" height="16" rx="1" fill="#00f5d4"/>
      <rect x="14" y="5" width="4" height="8" rx="1" fill="#00f5d4"/>
      <rect x="21" y="0" width="4" height="18" rx="1" fill="#00f5d4"/>
      <rect x="28" y="4" width="4" height="10" rx="1" fill="#00f5d4"/>
      <rect x="35" y="2" width="4" height="14" rx="1" fill="#00bbf9"/>
      <rect x="42" y="6" width="4" height="6" rx="1" fill="#38bdf8"/>
      <rect x="49" y="8" width="4" height="4" rx="1" fill="#38bdf8"/>
    </g>

    <!-- Transcribed Audio Card -->
    <g transform="translate(20, 52)">
      <rect width="488" height="64" rx="6" fill="#0c111c" stroke="#1f2c44" stroke-width="1"/>
      <text x="14" y="22" class="mono" font-size="10" font-weight="600" fill="#5eead4">AUDIO DETECTADO [GROQ WHISPER &lt;300ms]:</text>
      <text x="14" y="45" class="sans" font-size="13" fill="#e2e8f0">"How should we optimize the multi-threaded audio buffer in Python?"</text>
    </g>

    <!-- AI Suggested Response Card -->
    <g transform="translate(20, 128)">
      <rect width="488" height="82" rx="6" fill="#0a1424" stroke="#1d4ed8" stroke-opacity="0.4" stroke-width="1"/>
      <text x="14" y="22" class="mono" font-size="10" font-weight="700" fill="#60a5fa">RESPUESTA SUGERIDA (LLM COPILOT):</text>
      <text x="14" y="45" class="sans" font-size="13" font-weight="500" fill="#ffffff">"Use a non-blocking circular buffer with PyAudio WASAPI loopback."</text>
      <text x="14" y="66" class="mono" font-size="11" fill="#93c5fd">Fonética: /ju:z ə nɒn ˈblɒk.ɪŋ ˈsɜː.kjə.lər ˈbʌf.ər/</text>
    </g>

    <!-- Bottom HUD Meta -->
    <text x="24" y="238" class="mono" font-size="10" fill="#586c91">PYQT6 · SILERO-VAD · LOW-LATENCY 60 FPS</text>
    <text x="504" y="238" class="mono" font-size="10" fill="#00f5d4" text-anchor="end">OPEN SOURCE</text>
  </g>
</svg>
